[package]
name = "server"
version = "0.2.0"
license = "ISC"
edition = "2021"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zcash_primitives = "0.30.0"
zcash_protocol = "0.10.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.neon]
version = "1"
default-features = false
features = ["napi-6"]

[profile.release]
# Keep the addon small and fast; panics are caught at the FFI boundary.
lto = "thin"
codegen-units = 1
strip = true
